# iPad 版の Xcode プロジェクト（XcodeGen で生成する: cd iPad && xcodegen）
name: NanopicPad
options:
  bundleIdPrefix: com.hashrock
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
packages:
  Nanopic:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.11.0"
    CURRENT_PROJECT_VERSION: "1"
schemes:
  NanopicPad:
    build:
      targets:
        NanopicPad: all
    # 描画エンジンは最適化なしだと極端に遅いので、⌘R でも Release で動かす
    run:
      config: Release
targets:
  NanopicPad:
    type: application
    platform: iOS
    sources:
      - path: Nanopic
      # プライバシーマニフェストは Mac 版と同じもの（UserDefaults だけ。収集なし）
      - path: ../Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # 表示言語（日本語・英語）。訳のカタログは Mac 版と同じもの（エージェント連携の Agent の表は入れない）
      - path: ../Resources/Localizable.xcstrings
        buildPhase: resources
      - path: ../Resources/Names.xcstrings
        buildPhase: resources
    dependencies:
      - package: Nanopic
        product: NanopicKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hashrock.nanopic
        DEVELOPMENT_TEAM: 5WLLZHK49R
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Nanopic
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_ENTITLEMENTS: Nanopic/Nanopic.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nanopic
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
    info:
      path: Nanopic/Info.plist
      properties:
        # 版は上の MARKETING_VERSION / CURRENT_PROJECT_VERSION から入れる
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 暗号は使っていない（App Store Connect の輸出コンプライアンスの質問を省く）
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.graphics-design
        # 表示言語（App Store の「言語」に出る）
        CFBundleLocalizations: [ja, en]
        # 書類フォルダーをファイル App の「このiPad内 › Nanopic」に出す（LSSupportsOpeningDocumentsInPlace と両方要る。
        # INFOPLIST_KEY_UIFileSharingEnabled だけでは、できた Info.plist に入らなかった）
        UIFileSharingEnabled: true
        # iCloud container をファイル App の「iCloud Drive › Nanopic」に出す（Mac の Finder にも出る）
        NSUbiquitousContainers:
          iCloud.com.hashrock.nanopic:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Nanopic
            NSUbiquitousContainerSupportedFolderLevels: Any
        CFBundleDocumentTypes:
          - CFBundleTypeName: Photoshop Document
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.photoshop-image]
          - CFBundleTypeName: Image
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.png, public.jpeg, public.heic, public.tiff]
    # iCloud container（iCloud.com.hashrock.nanopic）。Apple Developer で container を登録し、App ID に iCloud を付けてから使う
    entitlements:
      path: Nanopic/Nanopic.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.hashrock.nanopic]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.hashrock.nanopic]
        com.apple.developer.icloud-services: [CloudDocuments]
        # ブラシ・パレットの同期（NSUbiquitousKeyValueStore）。Mac 版（scripts/package-appstore.sh）と同じ識別子にする
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.hashrock.nanopic
