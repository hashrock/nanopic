# iPad 版の Xcode プロジェクト（XcodeGen で生成する: cd iPad && xcodegen）
name: NanopicPad
options:
  bundleIdPrefix: com.hashrock
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
packages:
  Nanopic:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
schemes:
  NanopicPad:
    build:
      targets:
        NanopicPad: all
    # 描画エンジンは最適化なしだと極端に遅いので、⌘R でも Release で動かす
    run:
      config: Release
targets:
  NanopicPad:
    type: application
    platform: iOS
    sources:
      - path: Nanopic
    dependencies:
      - package: Nanopic
        product: NanopicKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hashrock.nanopic
        DEVELOPMENT_TEAM: 5WLLZHK49R
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Nanopic
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nanopic
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
    info:
      path: Nanopic/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Photoshop Document
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.photoshop-image]
          - CFBundleTypeName: Image
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.png, public.jpeg, public.heic, public.tiff]
